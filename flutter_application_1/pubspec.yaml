name: budgetmate
description: แอปพลิเคชันจัดการการเงินส่วนบุคคล BUDGETMATE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.5.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.5
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  firebase_core: ^3.6.0
  flutter_tesseract_ocr: ^0.4.31
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
    - assets/images/loading.gif
    - assets/images/google_logo.png
    - assets/images/categories/
  fonts:
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Mali-Light.ttf
          weight: 300
        - asset: assets/fonts/Mali-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mali-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mali-Bold.ttf
          weight: 700